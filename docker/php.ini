; A photograph may be 5 MB (App\Support\Uploads::MAX_BYTES). PHP refuses a
; larger body before anything reads it; the margin covers the multipart envelope,
; so the app's own check is the one that answers, in Portuguese.
upload_max_filesize = 6M
post_max_size = 7M

; GD holds a decoded photograph at four bytes a pixel: a 12-megapixel phone
; photograph is 48 MB, and Uploads::MAX_PIXELS allows 40 megapixels, 160 MB.
memory_limit = 256M

expose_php = Off
