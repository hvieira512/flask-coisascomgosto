# The suite and the type check, on every push and pull request.
#
# Until this existed the checks only ran when somebody remembered to run them,
# which for a two-person project means "when something already looks wrong".
#
# The database is a real MySQL, because the suite is: the SQL is hand-written for
# MySQL 8, the migrations take advisory locks, and the fixtures rely on TRUNCATE
# resetting AUTO_INCREMENT. SQLite would pass and prove nothing.
name: checks

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # The steps below start as soon as the job does, so waiting for the
        # server here is what stops the first connection racing the container.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # 3.12 is what the image ships; testing on anything else tests something
      # nobody runs.
      PYTHON_VERSION: "3.12"

      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      # The suite creates and drops this schema on every run. conftest.py refuses
      # to touch a database whose name does not end in _test.
      MYSQL_DATABASE: coisascomgosto_test

      # config.py refuses to start on the placeholders .env.example ships unless
      # FLASK_DEBUG=1, and the reloader has no business here. These are the same
      # values the app fixture sets.
      FLASK_DEBUG: "0"
      SECRET_KEY: test-secret
      JWT_SECRET_KEY: test-jwt-secret-key-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # A virtualenv at ./env rather than the system Python, because
      # pyrightconfig.json names that path — one configuration that means the
      # same thing here and on a developer's machine.
      - name: Install into ./env
        run: |
          python -m venv env
          env/bin/pip install --upgrade pip
          env/bin/pip install -r requirements-dev.txt

      # Without the browser, 100-odd tests skip themselves quietly and the run
      # still passes — which is worse than failing.
      - run: env/bin/playwright install --with-deps chromium

      - name: Fail if the browser tests would skip
        run: |
          env/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              p.chromium.launch().close()
          print("chromium is available")
          PY

      - run: env/bin/pytest -q

      - run: env/bin/pyright
