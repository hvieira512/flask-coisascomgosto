{# Bulma modal. Opened by any element carrying data-modal-target="<id>", and
   closed by the background, the × or any data-modal-close element — all wired
   in static/js/dashboard/menus.js. #}
<div class="modal" id="{{ modal_id }}" aria-labelledby="{{ modal_id }}-title">
    <div class="modal-background" data-modal-close></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title" id="{{ modal_id }}-title">{{ modal_title }}</p>
            <button class="delete" aria-label="Fechar" data-modal-close></button>
        </header>
        <section class="modal-card-body">
            {{ modal_content | safe }}
        </section>
        <footer class="modal-card-foot">
            {{ modal_footer | safe }}
        </footer>
    </div>
</div>
