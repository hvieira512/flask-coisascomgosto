<!DOCTYPE html>
<html lang="pt" data-bs-theme="light" class="{% block html_class %}{% endblock %}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CoisasComGosto{% endblock %}</title>
    <link href="{{ url_for('static', filename='img/logo.png') }}" rel="icon" type="image/png">
    <link href="{{ url_for('static', filename='bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
    {% block styles %}{% endblock %}
    <script src="{{ url_for('static', filename='fontawesome/a38dd6e785.js') }}" crossorigin="anonymous"></script>
    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    {% include 'components/loader.html' %}

    {% block body %}{% block content %}{% endblock %}{% endblock %}

    <script src="{{ url_for('static', filename='bootstrap/bootstrap.bundle.min.js') }}"></script>

    <script type="module" src="{{ url_for('static', filename='js/store/loader.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
