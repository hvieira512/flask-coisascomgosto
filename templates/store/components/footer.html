{# Deliberately minimal — contact details are a proper section on the landing
   page now, so the footer only closes the page. Bulma .footer + .level. #}
<footer class="footer py-5">
    <div class="container">
        <div class="level is-mobile-tablet">
            <div class="level-left">
                <p class="level-item has-text-weight-bold">Coisas com Gosto</p>
            </div>

            <div class="level-item">
                <nav class="is-flex" aria-label="rodapé">
                    <a class="is-size-7 has-text-grey mx-3"
                       href="{{ url_for('web.store.home') }}">Início</a>
                    <a class="is-size-7 has-text-grey mx-3"
                       href="{{ url_for('web.store.products') }}">Produtos</a>
                    <a class="is-size-7 has-text-grey mx-3"
                       href="{{ url_for('web.store.home') }}#contacts">Contactos</a>
                </nav>
            </div>

            <div class="level-right">
                <p class="level-item is-size-7 has-text-grey-light">
                    Viana do Castelo · {{ year }}
                </p>
            </div>
        </div>
    </div>
</footer>
