{% extends 'store/base.html' %}

{% block page_title %}Página não encontrada{% endblock %}

{% block content %}
<section class="section is-medium">
    <div class="container has-text-centered">
        <p class="eyebrow">Erro 404</p>
        <h1 class="title is-3 is-spaced">Página não encontrada</h1>
        <p class="subtitle is-6 has-text-grey">
            A página que procura não existe ou foi movida.
        </p>

        <div class="buttons is-centered mt-6">
            <a class="button is-dark" href="{{ url_for('web.store.home') }}">Voltar ao início</a>
            <a class="button is-light" href="{{ url_for('web.store.products') }}">Ver catálogo</a>
        </div>
    </div>
</section>
{% endblock %}
