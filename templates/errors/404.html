{% extends 'store/base.html' %}

{% block page_title %}Página não encontrada{% endblock %}

{% block content %}
<section class="section is-medium">
    <div class="container text-center">
        <p class="eyebrow">Erro 404</p>
        <h1 class="h2 mb-3">Página não encontrada</h1>
        <p class="text-body-secondary">
            A página que procura não existe ou foi movida.
        </p>

        <div class="d-flex flex-wrap justify-content-center gap-2 mt-5">
            <a class="btn btn-dark" href="{{ url_for('web.store.home') }}">Voltar ao início</a>
            <a class="btn btn-light" href="{{ url_for('web.store.products') }}">Ver catálogo</a>
        </div>
    </div>
</section>
{% endblock %}
